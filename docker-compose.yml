# Docker Compose configuration for IoT Dashboard
# Note: 'version' is obsolete in Docker Compose v2+

services:
  iot-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-dashboard
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge
