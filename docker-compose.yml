services:
  # ==========================================================================
  # MariaDB database
  # --------------------------------------------------------------------------
  # Bewust GEEN `ports:` sectie. De database is alleen bereikbaar vanaf het
  # interne Docker netwerk, niet vanaf het internet. Zie README voor hoe je
  # hem tijdelijk openzet om mee te debuggen.
  # ==========================================================================
  db:
    image: mariadb:11
    container_name: iot-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-iot_dashboard}
      MARIADB_USER: ${MARIADB_USER:-iot_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD ontbreekt in .env}
      # Het root-wachtwoord wordt willekeurig gegenereerd en nergens bewaard.
      # De applicatiegebruiker heeft alle rechten op de app-database, dus voor
      # normaal beheer en de queries in de README is root niet nodig.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iot-network

  # ==========================================================================
  # Backend API
  # --------------------------------------------------------------------------
  # Ook niet publiek: nginx proxyt /api hiernaartoe over het interne netwerk.
  # ==========================================================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MARIADB_HOST: db
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-iot_dashboard}
      MARIADB_USER: ${MARIADB_USER:-iot_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD ontbreekt in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ontbreekt in .env}
      # Zet op true zodra de VM een HTTPS certificaat heeft
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Simulatie instellingen
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SENSOR_INTERVAL_MS: ${SENSOR_INTERVAL_MS:-60000}
      SENSOR_LOG_LIMIT: ${SENSOR_LOG_LIMIT:-500}
    networks:
      - iot-network

  # ==========================================================================
  # Frontend (nginx) - het enige dat publiek bereikbaar is
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3002}:80"
    networks:
      - iot-network

volumes:
  # Named volume: de database overleeft `docker compose down`.
  # Let op: `docker compose down -v` wist hem WEL.
  db_data:

networks:
  iot-network:
    driver: bridge
