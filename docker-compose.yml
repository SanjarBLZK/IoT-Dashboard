services:
  # ==========================================================================
  # PostgreSQL database
  # --------------------------------------------------------------------------
  # Bewust GEEN `ports:` sectie. De database is alleen bereikbaar vanaf het
  # interne Docker netwerk, niet vanaf het internet. Zie README voor hoe je
  # hem tijdelijk openzet om mee te debuggen.
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: iot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt in .env}
      # Zorgt voor correcte sortering en tekstvergelijking
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iot-network

  # ==========================================================================
  # Backend API
  # --------------------------------------------------------------------------
  # Ook niet publiek: nginx proxyt /api hiernaartoe over het interne netwerk.
  # ==========================================================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ontbreekt in .env}
      # Zet op true zodra de VM een HTTPS certificaat heeft
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Simulatie instellingen
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SENSOR_INTERVAL_MS: ${SENSOR_INTERVAL_MS:-60000}
      SENSOR_LOG_LIMIT: ${SENSOR_LOG_LIMIT:-500}
    networks:
      - iot-network

  # ==========================================================================
  # Frontend (nginx) - het enige dat publiek bereikbaar is
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3002}:80"
    networks:
      - iot-network

volumes:
  # Named volume: de database overleeft `docker compose down`.
  # Let op: `docker compose down -v` wist hem WEL.
  db_data:

networks:
  iot-network:
    driver: bridge
